openapi: 3.0.3
servers:
  - url: http://localhost:8888
info:
  version: 999-SNAPSHOT
  title: Users API
paths:
  /users/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
          examples:
            alice:
              value: 1
      responses:
        "200":
          description: Ok
          content:
            "application/json":
              examples:
                alice:
                  value:
                    '{"name": "Alice", "age": 80}'
